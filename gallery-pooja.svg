<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311005"/>
      <stop offset="100%" stop-color="#581c0c"/>
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#g4)"/>
  <circle cx="300" cy="180" r="160" fill="url(#auraGlow)"/>
  <!-- Decorative Bell & Aarti Flame -->
  <g transform="translate(300, 180)" stroke="#fbbf24" stroke-width="2" fill="none">
    <!-- Temple Bell -->
    <path d="M 0 -80 L 0 -55" stroke-width="3"/>
    <path d="M -25 -20 C -25 -50, 25 -50, 25 -20 L 30 -5 L -30 -5 Z" fill="#d97706" fill-opacity="0.4"/>
    <line x1="-32" y1="-5" x2="32" y2="-5" stroke-width="3"/>
    <circle cx="0" cy="8" r="5" fill="#fcd34d"/>
    <!-- Lotus Plate with Aarti Lamp -->
    <ellipse cx="0" cy="65" rx="50" ry="12" fill="#b45309" fill-opacity="0.5"/>
    <path d="M 0 35 Q 10 52 0 62 Q -10 52 0 35 Z" fill="#fef08a" stroke="#f59e0b"/>
  </g>
  <rect x="140" y="325" width="320" height="38" rx="19" fill="#1c1917" fill-opacity="0.8" stroke="#f59e0b" stroke-opacity="0.4"/>
  <text x="300" y="350" fill="#fef3c7" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    📷 Maha Shivaratri &amp; Seva (Upload Photo)
  </text>
  <text x="300" y="388" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle" opacity="0.8">
    Holy Abhisheka &amp; Deeparadhana
  </text>
</svg>
