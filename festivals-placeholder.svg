<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="festGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#2d0f02"/>
    </linearGradient>
    <radialGradient id="festGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#dc2626" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#festGrad)"/>
  <circle cx="400" cy="240" r="230" fill="url(#festGlow)"/>

  <!-- Ornate Border -->
  <rect x="25" y="25" width="750" height="550" rx="16" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Sacred Ratha (Temple Chariot) Silhouette -->
  <g transform="translate(400, 240)" stroke="#fcd34d" stroke-width="2" fill="none">
    <!-- Ratha Pinnacle / Kalasha -->
    <path d="M 0 -150 L 0 -130" stroke-width="3"/>
    <circle cx="0" cy="-125" r="6" fill="#fbbf24"/>
    <!-- Flags -->
    <path d="M 0 -140 L 35 -145 L 0 -135" fill="#ef4444" stroke="#fcd34d"/>
    <!-- Dome Tiers -->
    <polygon points="0,-120 45,-80 -45,-80" fill="#f59e0b" fill-opacity="0.3"/>
    <polygon points="-50,-80 80,-40 -80,-40 50,-80" fill="#f59e0b" fill-opacity="0.3"/>
    <polygon points="-90,-40 120,10 -120,10 90,-40" fill="#f59e0b" fill-opacity="0.3"/>
    <!-- Chariot Mandapa / Deity Seat -->
    <rect x="-100" y="10" width="200" height="65" fill="#b45309" fill-opacity="0.4" stroke-width="2"/>
    <circle cx="0" cy="40" r="18" fill="#fbbf24" fill-opacity="0.6"/>
    <!-- Pillars in Mandapa -->
    <line x1="-80" y1="10" x2="-80" y2="75"/>
    <line x1="-35" y1="10" x2="-35" y2="75"/>
    <line x1="35" y1="10" x2="35" y2="75"/>
    <line x1="80" y1="10" x2="80" y2="75"/>
    <!-- Ratha Base -->
    <rect x="-130" y="75" width="260" height="25" fill="#f59e0b" fill-opacity="0.25"/>
    <!-- Giant Wooden Wheels -->
    <g stroke-width="2.5" fill="#78350f" fill-opacity="0.5">
      <circle cx="-85" cy="120" r="34"/>
      <circle cx="-85" cy="120" r="8" fill="#fcd34d"/>
      <line x1="-85" y1="86" x2="-85" y2="154"/>
      <line x1="-119" y1="120" x2="-51" y2="120"/>

      <circle cx="85" cy="120" r="34"/>
      <circle cx="85" cy="120" r="8" fill="#fcd34d"/>
      <line x1="85" y1="86" x2="85" y2="154"/>
      <line x1="51" y1="120" x2="119" y2="120"/>
    </g>
  </g>

  <!-- Labels -->
  <rect x="220" y="465" width="360" height="46" rx="23" fill="#1c1917" fill-opacity="0.85" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="400" y="494" fill="#fef3c7" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="1">
    📷 RATHOTSAVA &amp; FESTIVAL PHOTO
  </text>
  <text x="400" y="538" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" text-anchor="middle" opacity="0.85">
    Upload: Annual Chariot Festival &amp; Religious Procession
  </text>
</svg>
