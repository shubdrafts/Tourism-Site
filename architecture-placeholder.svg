<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2429"/>
      <stop offset="50%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#archGrad)"/>

  <!-- Ornate Border -->
  <rect x="25" y="25" width="750" height="550" rx="16" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="35" y="35" width="730" height="530" rx="12" fill="none" stroke="#60a5fa" stroke-opacity="0.15" stroke-dasharray="8 6" stroke-width="1.5"/>

  <!-- Coastal Karnataka Sloping Roof Architecture Silhouette -->
  <g transform="translate(400, 240)" stroke="#f59e0b" stroke-width="2" fill="none">
    <!-- Golden Pinnacle / Stupi -->
    <path d="M 0 -130 L 0 -105" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-100" r="7" fill="#fbbf24"/>
    <ellipse cx="0" cy="-90" rx="12" ry="5" fill="#f59e0b"/>

    <!-- Sloping Roof Top Tier -->
    <polygon points="0,-85 140,-20 -140,-20" fill="#f59e0b" fill-opacity="0.2"/>
    <path d="M -140 -20 Q 0 -45 140 -20" stroke-width="2.5"/>

    <!-- Roof Tier 2 -->
    <polygon points="-110,-20 180,45 -180,45 -110,-20" fill="#f59e0b" fill-opacity="0.25"/>
    <path d="M -180 45 Q 0 15 180 45" stroke-width="2.5"/>

    <!-- Carved Wooden Pillars -->
    <g fill="#d97706" fill-opacity="0.3">
      <!-- Left Outer Pillar -->
      <rect x="-160" y="45" width="22" height="115"/>
      <rect x="-165" y="45" width="32" height="12"/>
      <rect x="-165" y="148" width="32" height="12"/>

      <!-- Left Mid Pillar -->
      <rect x="-80" y="45" width="20" height="115"/>
      <rect x="-84" y="45" width="28" height="12"/>
      <rect x="-84" y="148" width="28" height="12"/>

      <!-- Right Mid Pillar -->
      <rect x="60" y="45" width="20" height="115"/>
      <rect x="56" y="45" width="28" height="12"/>
      <rect x="56" y="148" width="28" height="12"/>

      <!-- Right Outer Pillar -->
      <rect x="138" y="45" width="22" height="115"/>
      <rect x="133" y="45" width="32" height="12"/>
      <rect x="133" y="148" width="32" height="12"/>
    </g>

    <!-- Stone Plinth / Basement -->
    <rect x="-190" y="160" width="380" height="24" fill="#f59e0b" fill-opacity="0.2" stroke-width="2"/>
    <!-- Steps -->
    <polygon points="-80,184 80,184 95,200 -95,200" fill="#d97706" fill-opacity="0.3"/>
  </g>

  <!-- Labels -->
  <rect x="230" y="470" width="340" height="46" rx="23" fill="#0f172a" fill-opacity="0.8" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="400" y="499" fill="#fef3c7" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="1">
    📷 TEMPLE ARCHITECTURE PHOTO
  </text>
  <text x="400" y="542" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" text-anchor="middle" opacity="0.85">
    Upload: Coastal Karnataka Sloping Roof &amp; Outer Courtyard
  </text>
</svg>
