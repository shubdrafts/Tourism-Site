<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="40%" stop-color="#2a1205"/>
      <stop offset="75%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1e1b18"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sacredGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1.5" fill="#f59e0b" fill-opacity="0.15"/>
      <path d="M 0 30 L 60 30 M 30 0 L 30 60" stroke="#f59e0b" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#heroGrad)"/>
  <rect width="1600" height="900" fill="url(#sacredGrid)"/>
  <circle cx="800" cy="420" r="500" fill="url(#glowGrad)"/>

  <!-- Decorative Temple Shikhara / Dome Outline -->
  <g transform="translate(800, 380)" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.45">
    <!-- Kalasha & Pinnacle -->
    <path d="M 0 -220 L 0 -170" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-160" r="8" fill="#f59e0b" fill-opacity="0.6"/>
    <!-- Shikhara Tiers -->
    <path d="M 0 -150 L 50 -80 L 110 -10 L 160 70 L -160 70 L -110 -10 L -50 -80 Z"/>
    <path d="M -130 30 L 130 30"/>
    <path d="M -90 -35 L 90 -35"/>
    <path d="M -40 -95 L 40 -95"/>
    <!-- Sanctum arch -->
    <path d="M -80 70 C -80 -20, 80 -20, 80 70"/>
    <circle cx="0" cy="25" r="22" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Central Trishul / Holy Symbol silhouette -->
  <g transform="translate(800, 410)" fill="#fbbf24" opacity="0.85">
    <!-- Central Spear -->
    <path d="M -4 50 L -4 -60 L 0 -85 L 4 -60 L 4 50 Z"/>
    <!-- Left Prong -->
    <path d="M -4 -15 C -25 -18, -40 -45, -35 -75 C -30 -50, -18 -35, -4 -30 Z"/>
    <!-- Right Prong -->
    <path d="M 4 -15 C 25 -18, 40 -45, 35 -75 C 30 -50, 18 -35, 4 -30 Z"/>
    <!-- Crescent Moon -->
    <path d="M -15 -90 C -5 -98, 12 -96, 18 -85 C 10 -90, -4 -90, -15 -90 Z"/>
  </g>

  <!-- Placeholder Badge & Information -->
  <rect x="560" y="580" width="480" height="64" rx="32" fill="#000000" fill-opacity="0.6" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="800" y="618" fill="#fef3c7" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="1.5">
    📷 HERO BANNER PLACEHOLDER
  </text>
  <text x="800" y="680" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" text-anchor="middle" opacity="0.8">
    Replace with photo of Sri Mahalingeshwara Temple, Adyar
  </text>
</svg>
