<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#3b1307"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="lampLight" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#g2)"/>
  <circle cx="300" cy="180" r="160" fill="url(#lampLight)"/>
  <!-- Decorative Diyas / Deepam -->
  <g transform="translate(300, 190)" fill="#fbbf24">
    <!-- Big Diya -->
    <ellipse cx="0" cy="15" rx="36" ry="12" fill="#d97706"/>
    <path d="M -30 15 Q 0 0 30 15 Q 0 28 -30 15 Z" fill="#b45309"/>
    <!-- Flame -->
    <path d="M 0 5 Q 8 -18 0 -35 Q -8 -18 0 5 Z" fill="#fef08a"/>
    <circle cx="0" cy="-12" r="5" fill="#f97316"/>
    <!-- Little Diyas on sides -->
    <g transform="translate(-75, 20)">
      <ellipse cx="0" cy="8" rx="20" ry="7" fill="#d97706"/>
      <path d="M 0 2 Q 5 -12 0 -22 Q -5 -12 0 2 Z" fill="#fef08a"/>
    </g>
    <g transform="translate(75, 20)">
      <ellipse cx="0" cy="8" rx="20" ry="7" fill="#d97706"/>
      <path d="M 0 2 Q 5 -12 0 -22 Q -5 -12 0 2 Z" fill="#fef08a"/>
    </g>
  </g>
  <rect x="140" y="325" width="320" height="38" rx="19" fill="#1c1917" fill-opacity="0.8" stroke="#f59e0b" stroke-opacity="0.4"/>
  <text x="300" y="350" fill="#fef3c7" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    📷 Karthika Deepotsava (Upload Photo)
  </text>
  <text x="300" y="388" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle" opacity="0.8">
    Illumination with Oil Lamps
  </text>
</svg>
